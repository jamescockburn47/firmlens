<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1080" role="img" aria-labelledby="title desc">
<title id="title">FirmLens: code, website, database and AI</title>
<desc id="desc">GitHub stores code and proposed changes. James reviews resident changes; automated checks verify the build; Vercel hosts the live website and server. A visitor's browser asks the server for saved records in Neon Postgres. The server fetches known official sources, checks the owner's identity through Neon Auth, and exchanges evidence and analysis with ChatGPT or Codex through authenticated tools. AI does not run when a visitor reads a card. firmlens.app is live on Vercel and Neon. Cloud analysis and saving passed. The weekly task is enabled; three source checks failed in its manual test.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#48677c" stroke-width="1.5"/></marker></defs>
<rect width="1300" height="1080" fill="#f4f7f8"/><g font-family="Arial,sans-serif"><text x="40" y="49" font-size="34" fill="#143a50" font-weight="700">FirmLens · how the pieces fit together</text><text x="40" y="83" font-size="21" fill="#263e50" font-weight="400">Live at firmlens.app · migration verified 7 November 2026</text><text x="40" y="113" font-size="19" fill="#263e50" font-weight="400">Vercel runs the website and server. Neon stores the data and verifies owner sign-in.</text><text x="40" y="160" font-size="19" fill="#143a50" font-weight="700">1  HOW A CHANGE BECOMES A WEBSITE</text><g><rect x="40" y="180" width="275" height="146" rx="12" fill="white" stroke="#adc2cb"/><text x="58" y="212" font-size="22" fill="#143a50" font-weight="700">GitHub</text><text x="58" y="243" font-size="17" fill="#263e50" font-weight="400">Code and its history</text><text x="58" y="268" font-size="17" fill="#263e50" font-weight="400">Your branch and pull request</text><text x="58" y="304" font-size="17" fill="#17604b" font-weight="700">Public repository</text></g><g><rect x="355" y="180" width="275" height="146" rx="12" fill="white" stroke="#adc2cb"/><text x="373" y="212" font-size="22" fill="#143a50" font-weight="700">James reviews</text><text x="373" y="243" font-size="17" fill="#263e50" font-weight="400">What changed and why?</text><text x="373" y="268" font-size="17" fill="#263e50" font-weight="400">Approve before merging</text><text x="373" y="304" font-size="17" fill="#17604b" font-weight="700">Resident changes reviewed</text></g><g><rect x="670" y="180" width="275" height="146" rx="12" fill="white" stroke="#adc2cb"/><text x="688" y="212" font-size="22" fill="#143a50" font-weight="700">Automated checks</text><text x="688" y="243" font-size="17" fill="#263e50" font-weight="400">Tests, types and build</text><text x="688" y="268" font-size="17" fill="#263e50" font-weight="400">Same verification command</text><text x="688" y="304" font-size="17" fill="#17604b" font-weight="700">Checks pass on current main</text></g><g><rect x="985" y="180" width="275" height="146" rx="12" fill="white" stroke="#adc2cb"/><text x="1003" y="212" font-size="22" fill="#143a50" font-weight="700">Vercel</text><text x="1003" y="243" font-size="17" fill="#263e50" font-weight="400">Builds the approved code</text><text x="1003" y="268" font-size="17" fill="#263e50" font-weight="400">Hosts website and server</text><text x="1003" y="304" font-size="17" fill="#17604b" font-weight="700">Live on firmlens.app</text></g><path d="M315 253H350" stroke="#48677c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M630 253H665" stroke="#48677c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M945 253H980" stroke="#48677c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="40" y="380" font-size="19" fill="#143a50" font-weight="700">2  WHAT HAPPENS WHEN SOMEONE USES IT</text><g><rect x="40" y="420" width="350" height="146" rx="12" fill="white" stroke="#adc2cb"/><text x="58" y="452" font-size="22" fill="#143a50" font-weight="700">Visitor’s browser</text><text x="58" y="483" font-size="19" fill="#263e50" font-weight="400">Search, filters and source links</text><text x="58" y="508" font-size="19" fill="#263e50" font-weight="400">Reads saved summaries/history</text><text x="58" y="544" font-size="17" fill="#17604b" font-weight="700">Public · no login required</text></g><g><rect x="475" y="420" width="350" height="146" rx="12" fill="white" stroke="#adc2cb"/><text x="493" y="452" font-size="22" fill="#143a50" font-weight="700">Next.js server on Vercel</text><text x="493" y="483" font-size="19" fill="#263e50" font-weight="400">API: requests and responses</text><text x="493" y="508" font-size="19" fill="#263e50" font-weight="400">Permission and evidence checks</text><text x="493" y="544" font-size="17" fill="#17604b" font-weight="700">Public reads / owner refresh tested</text></g><g><rect x="910" y="420" width="350" height="146" rx="12" fill="white" stroke="#adc2cb"/><text x="928" y="452" font-size="22" fill="#143a50" font-weight="700">Neon Postgres database</text><text x="928" y="483" font-size="19" fill="#263e50" font-weight="400">Announcements and source text</text><text x="928" y="508" font-size="19" fill="#263e50" font-weight="400">Summaries and checking history</text><text x="928" y="544" font-size="17" fill="#17604b" font-weight="700">Original data restored and checked</text></g><path d="M390 489H470" stroke="#48677c" stroke-width="2.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M825 489H905" stroke="#48677c" stroke-width="2.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="400" y="413" font-size="16" fill="#263e50" font-weight="400">reads</text><text x="834" y="413" font-size="16" fill="#263e50" font-weight="400">stores</text><text x="40" y="620" font-size="19" fill="#143a50" font-weight="700">3  HOW RECORDS ARE CHECKED AND UPDATED</text><g><rect x="40" y="710" width="350" height="146" rx="12" fill="white" stroke="#adc2cb"/><text x="58" y="742" font-size="22" fill="#143a50" font-weight="700">Official source pages</text><text x="58" y="773" font-size="19" fill="#263e50" font-weight="400">Server fetches known firm URLs</text><text x="58" y="798" font-size="19" fill="#263e50" font-weight="400">Keeps a copy of retrieved text</text><text x="58" y="834" font-size="17" fill="#864414" font-weight="700">Some sources block fetching</text></g><g><rect x="475" y="710" width="350" height="146" rx="12" fill="white" stroke="#adc2cb"/><text x="493" y="742" font-size="22" fill="#143a50" font-weight="700">ChatGPT / Codex account</text><text x="493" y="773" font-size="19" fill="#263e50" font-weight="400">Tools return evidence to the AI</text><text x="493" y="798" font-size="19" fill="#263e50" font-weight="400">AI sends a summary and quote</text><text x="493" y="834" font-size="17" fill="#17604b" font-weight="700">Cloud analysis and save tested</text></g><g><rect x="910" y="710" width="350" height="146" rx="12" fill="white" stroke="#adc2cb"/><text x="928" y="742" font-size="22" fill="#143a50" font-weight="700">Neon Auth</text><text x="928" y="773" font-size="19" fill="#263e50" font-weight="400">Google owner sign-in and OAuth</text><text x="928" y="798" font-size="19" fill="#263e50" font-weight="400">Server allows only James to edit</text><text x="928" y="834" font-size="17" fill="#17604b" font-weight="700">Browser owner sign-in tested</text></g><path d="M215 705V670H515V571" stroke="#48677c" stroke-width="2.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M650 705V571" stroke="#48677c" stroke-width="2.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M1085 705V670H785V571" stroke="#48677c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="45" y="650" font-size="17" fill="#263e50" font-weight="400">Fetch source / return text</text><text x="666" y="695" font-size="17" fill="#263e50" font-weight="400">Evidence / analysis</text><text x="945" y="698" font-size="17" fill="#263e50" font-weight="400">Verify identity</text><rect x="40" y="890" width="1220" height="72" rx="10" fill="#fff3df" stroke="#b68341"/><text x="58" y="920" font-size="21" fill="#75400f" font-weight="700">Weekly cloud task — Mondays at 09:00 Europe/London</text><text x="58" y="948" font-size="18" fill="#75400f" font-weight="400">Manual run: 14 checked · 11 fetched · 2 summaries saved · 3 source failures. Future timed run still to occur.</text><text x="40" y="1005" font-size="19" fill="#263e50" font-weight="400">Reading a card does not call an LLM. The AI works through the owner’s account; the app has no model API key.</text><text x="40" y="1042" font-size="19" fill="#263e50" font-weight="400">A matching quotation proves the words occur in the source. It does not prove every claim in the summary.</text></g></svg>