<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 790" role="img" aria-labelledby="title desc"><title id="title">FirmLens architecture and migration status</title><desc id="desc">Public website connects to the Vercel server and Neon database. The owner signs in through Neon. Codex supplies AI analysis through tools. Source fetches preserve evidence. GitHub holds proposed changes. Domain cutover and native tool execution remain pending.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52697b" stroke-width="1.5"/></marker></defs><rect width="1180" height="790" fill="#f7f8f3"/><g font-family="Arial,sans-serif" fill="#18364c"><text x="55" y="54" font-size="30" font-weight="700">FirmLens · what runs where</text><text x="55" y="88" font-size="17">Migration snapshot · 7 November 2026 · public domain still on the original host</text></g><g stroke="#52697b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M325 187H400"/><path d="M745 187H820"/><path d="M190 345V283H510V250"/><path d="M575 345V250"/><path d="M975 345V250"/><path d="M325 610H400"/><path d="M575 555V460"/></g><g font-family="Arial,sans-serif"><rect x="55" y="135" width="270" height="140" rx="12" fill="white" stroke="#b7c7ca"/><text x="73" y="164" font-size="19" font-weight="700" fill="#18364c">1  Public website</text><text x="73" y="192" font-size="16" fill="#40596b">Search · filter · inspect sources</text><text x="73" y="215" font-size="16" fill="#40596b">Stored summaries and history</text><text x="73" y="252" font-size="14" font-weight="700" fill="#24604b">Public reads verified</text></g><g font-family="Arial,sans-serif"><rect x="405" y="135" width="340" height="140" rx="12" fill="white" stroke="#b7c7ca"/><text x="423" y="164" font-size="19" font-weight="700" fill="#18364c">2  Server on Vercel</text><text x="423" y="192" font-size="16" fill="#40596b">Checks permissions and inputs</text><text x="423" y="215" font-size="16" fill="#40596b">Reads and writes the database</text><text x="423" y="252" font-size="14" font-weight="700" fill="#24604b">Build and owner check passed</text></g><g font-family="Arial,sans-serif"><rect x="825" y="135" width="300" height="140" rx="12" fill="white" stroke="#b7c7ca"/><text x="843" y="164" font-size="19" font-weight="700" fill="#18364c">3  Neon database</text><text x="843" y="192" font-size="16" fill="#40596b">Entries · source text · snapshots</text><text x="843" y="215" font-size="16" fill="#40596b">Saved summaries and history</text><text x="843" y="252" font-size="14" font-weight="700" fill="#24604b">Full restore verified</text></g><g font-family="Arial,sans-serif"><rect x="55" y="345" width="270" height="140" rx="12" fill="white" stroke="#b7c7ca"/><text x="73" y="374" font-size="19" font-weight="700" fill="#18364c">4  Owner sign-in</text><text x="73" y="402" font-size="16" fill="#40596b">Google → Neon Auth</text><text x="73" y="425" font-size="16" fill="#40596b">Only configured owner can write</text><text x="73" y="462" font-size="14" font-weight="700" fill="#24604b">Live owner session verified</text></g><g font-family="Arial,sans-serif"><rect x="405" y="345" width="340" height="140" rx="12" fill="white" stroke="#b7c7ca"/><text x="423" y="374" font-size="19" font-weight="700" fill="#18364c">5  AI through Codex</text><text x="423" y="402" font-size="16" fill="#40596b">Reads evidence · drafts analysis</text><text x="423" y="425" font-size="16" fill="#40596b">Returns summary and exact quote</text><text x="423" y="462" font-size="14" font-weight="700" fill="#8d4b13">Native tool test pending</text></g><g font-family="Arial,sans-serif"><rect x="825" y="345" width="300" height="140" rx="12" fill="white" stroke="#b7c7ca"/><text x="843" y="374" font-size="19" font-weight="700" fill="#18364c">6  Original source pages</text><text x="843" y="402" font-size="16" fill="#40596b">Known official firm URLs</text><text x="843" y="425" font-size="16" fill="#40596b">Fetching is ordinary code</text><text x="843" y="462" font-size="14" font-weight="700" fill="#8d4b13">Some pages block retrieval</text></g><g font-family="Arial,sans-serif"><rect x="55" y="555" width="270" height="140" rx="12" fill="white" stroke="#b7c7ca"/><text x="73" y="584" font-size="19" font-weight="700" fill="#18364c">7  GitHub</text><text x="73" y="612" font-size="16" fill="#40596b">Source · branches · pull requests</text><text x="73" y="635" font-size="16" fill="#40596b">Residents propose; James reviews</text><text x="73" y="672" font-size="14" font-weight="700" fill="#24604b">Public repository; CI passes</text></g><g font-family="Arial,sans-serif"><rect x="405" y="555" width="340" height="140" rx="12" fill="white" stroke="#b7c7ca"/><text x="423" y="584" font-size="19" font-weight="700" fill="#18364c">8  Hosting and updates</text><text x="423" y="612" font-size="16" fill="#40596b">Vercel runs the replacement app</text><text x="423" y="635" font-size="16" fill="#40596b">Old weekly job paused for migration</text><text x="423" y="672" font-size="14" font-weight="700" fill="#8d4b13">Domain cutover pending</text></g><g font-family="Arial,sans-serif"><rect x="825" y="555" width="300" height="140" rx="12" fill="white" stroke="#b7c7ca"/><text x="843" y="584" font-size="19" font-weight="700" fill="#18364c">Resident local preview</text><text x="843" y="612" font-size="16" fill="#40596b">Three invented example records</text><text x="843" y="635" font-size="16" fill="#40596b">No credentials or model calls</text><text x="843" y="672" font-size="14" font-weight="700" fill="#24604b">Local UI verified</text></g><text x="55" y="742" font-family="Arial,sans-serif" font-size="17" fill="#18364c">A quote match checks the words. It does not prove that every claim in the summary follows from them.</text></svg>